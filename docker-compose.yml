version: "3.8"

# =============================================================================
# docker-compose.yml - Development Environment
#
# Starts all infrastructure services plus the application in development mode
# with hot-reload enabled via bind mounts.
#
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d backend worker     # Start specific services
#   docker-compose down                     # Stop all services
#   docker-compose logs -f backend          # Follow backend logs
#   docker-compose exec backend npm test    # Run tests
# =============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL - Primary database
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: shopify-oracle-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: shopify_oracle_int
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_oracle_int"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # Redis - Cache and job coordination
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopify-oracle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # RabbitMQ - Message broker for async sync jobs
  # ────────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: shopify-oracle-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # Backend - Express API server
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    container_name: shopify-oracle-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/backend:/app/packages/backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopify_oracle_int
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # Worker - RabbitMQ consumer for sync job processing
  # ────────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: development
    container_name: shopify-oracle-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./packages/shared:/app/packages/shared
      - ./packages/worker:/app/packages/worker
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopify_oracle_int
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      RABBITMQ_PREFETCH: "10"
      HEARTBEAT_INTERVAL_MS: "60000"
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend - React SPA with Vite dev server
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: shopify-oracle-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - backend
    volumes:
      - ./packages/frontend:/app/packages/frontend
      # Exclude node_modules from bind mount to use container's node_modules
      - /app/packages/frontend/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
    networks:
      - app-network

  # ────────────────────────────────────────────────────────────────────────────
  # Nginx - Reverse proxy for production-like dev routing
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shopify-oracle-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

# ──────────────────────────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: shopify-oracle-postgres-data
  redis_data:
    name: shopify-oracle-redis-data
  rabbitmq_data:
    name: shopify-oracle-rabbitmq-data

# ──────────────────────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────────────────────
networks:
  app-network:
    name: shopify-oracle-network
    driver: bridge
