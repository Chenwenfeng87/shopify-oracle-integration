# =============================================================================
# nginx.conf - Shopify-Oracle Integration Reverse Proxy
#
# Routes:
#   /api/*      -> backend:3000 (Express API)
#   /health     -> backend:3000 (Health check endpoint)
#   /*          -> frontend:80  (React SPA with fallback to index.html)
#
# Features:
#   - WebSocket support for Vite HMR in development
#   - Gzip compression for text assets
#   - Security headers (Shopify iframe-compatible CSP)
#   - Rate limiting
#   - Request/response buffering optimization
# =============================================================================

# Main context - global nginx settings
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

# Load dynamic modules
load_module modules/ngx_http_headers_more_filter_module.so;

# Events context
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# HTTP context
http {
    # ──────────────────────────────────────────────────────────────────────────
    # MIME Types & Defaults
    # ──────────────────────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ──────────────────────────────────────────────────────────────────────────
    # Logging Format
    # ──────────────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ──────────────────────────────────────────────────────────────────────────
    # Performance Tuning
    # ──────────────────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Maximum body size (for webhook payloads)
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # Proxy buffer settings
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ──────────────────────────────────────────────────────────────────────────
    # Gzip Compression
    # ──────────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        application/javascript
        application/json
        application/xml
        application/x-javascript
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ──────────────────────────────────────────────────────────────────────────
    # Rate Limiting Zones
    # ──────────────────────────────────────────────────────────────────────────
    # General API rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Auth endpoint rate limit: 20 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    # Webhook rate limit: 200 requests per minute per IP (Shopify sends bursts)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=200r/m;

    # Burst zone for sync endpoints
    limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=30r/m;

    # ──────────────────────────────────────────────────────────────────────────
    # Upstream Definitions
    # ──────────────────────────────────────────────────────────────────────────
    upstream backend_upstream {
        least_conn;
        server backend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    # ──────────────────────────────────────────────────────────────────────────
    # Server Block
    # ──────────────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ──────────────────────────────────────────────────────────────────────
        # Security Headers
        # ──────────────────────────────────────────────────────────────────────
        # X-Frame-Options is intentionally NOT set to allow iframe embedding
        # within Shopify Admin via Content-Security-Policy frame-ancestors.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # Content Security Policy - allows Shopify iframe embedding
        # The backend sets the CSP with frame-ancestors for Shopify domains.
        # Here we set a base policy for static assets served by nginx.
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.shopify.com;
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com data:;
            img-src 'self' data: blob: https://cdn.shopify.com;
            connect-src 'self' https://*.myshopify.com wss://*.myshopify.com;
            frame-ancestors https://*.myshopify.com https://*.shopify.com;
            form-action 'self';
            base-uri 'self';
        " always;

        # Strict Transport Security (only in production with HTTPS)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ──────────────────────────────────────────────────────────────────────
        # API Routes -> Backend (Express)
        # ──────────────────────────────────────────────────────────────────────

        # Health check endpoint
        location /health {
            proxy_pass http://backend_upstream/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No rate limiting for health checks
            access_log off;

            # Short timeouts for health checks
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Auth routes (with stricter rate limiting)
        location /api/auth {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Disable buffering for auth flows
            proxy_buffering off;
        }

        # Webhook routes (higher rate limit, Shopify sends bursts)
        location /api/webhook {
            limit_req zone=webhook_limit burst=50 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Webhook payloads can be large, allow sufficient time
            proxy_read_timeout 120s;
        }

        # Sync routes
        location /api/sync {
            limit_req zone=sync_limit burst=10 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # General API routes
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Strip /api prefix when needed (Express handles routing)
            # proxy_set_header X-Original-URI $request_uri;
        }

        # WebSocket support for Vite HMR (development)
        location /ws {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ──────────────────────────────────────────────────────────────────────
        # Frontend Routes -> React SPA
        # ──────────────────────────────────────────────────────────────────────

        # Static assets with caching
        location /assets/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache static assets for 1 year (fingerprinted by Vite)
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
        }

        # Service worker (must not be cached)
        location /sw.js {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # All other routes -> SPA (client-side routing)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No cache for HTML (SPA may update)
            add_header Cache-Control "no-cache, no-store, must-revalidate";

            # Try_files for SPA routing: Serve index.html for all paths
            # so that React Router can handle client-side routing.
            # If running through proxy, the frontend nginx handles this.
        }
    }

    # ──────────────────────────────────────────────────────────────────────────
    # HTTPS Server (enable when SSL certificates are configured)
    # ──────────────────────────────────────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_tickets off;
    #
    #     # HSTS (uncomment after verifying HTTPS works)
    #     # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # Same location blocks as above
    #     # Include or duplicate the location blocks
    # }
}
